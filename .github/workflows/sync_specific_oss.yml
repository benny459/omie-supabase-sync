name: Sync Specific OSs (targeted refetch)

# Refetcha OSs específicas via ConsultarOS. Dispatched pelo painel via
# /api/oss/force-sync quando user vê discrepância Omie vs painel numa linha.

on:
  workflow_dispatch:
    inputs:
      os_numeros:
        description: "OS numbers (numero_os) separados por vírgula. Ex: 4590,4632"
        required: true
      empresas:
        description: "Empresas alvo (default: SF,CD,WW)"
        required: false
        default: "SF,CD,WW"

jobs:
  refetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: "Refetch OSs específicas"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OMIE_APP_KEY_SF: ${{ secrets.OMIE_APP_KEY_SF }}
          OMIE_APP_SECRET_SF: ${{ secrets.OMIE_APP_SECRET_SF }}
          OMIE_APP_KEY_CD: ${{ secrets.OMIE_APP_KEY_CD }}
          OMIE_APP_SECRET_CD: ${{ secrets.OMIE_APP_SECRET_CD }}
          OMIE_APP_KEY_WW: ${{ secrets.OMIE_APP_KEY_WW }}
          OMIE_APP_SECRET_WW: ${{ secrets.OMIE_APP_SECRET_WW }}
          EMPRESAS_ALVO: ${{ github.event.inputs.empresas || 'SF,CD,WW' }}
          OS_NUMEROS_ESPECIFICOS: ${{ github.event.inputs.os_numeros }}
          SHEETS_MIRROR_URL: ${{ secrets.SHEETS_MIRROR_URL }}
          SHEETS_MIRROR_TOKEN: ${{ secrets.SHEETS_MIRROR_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: |
          python3 scripts/import_servicos.py
