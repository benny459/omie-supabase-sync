name: Ciclo vendas avulsas — validação final (homologação)

# Validação final (05/10/2026): emite em HOMOLOGAÇÃO a NF-e de um PV nativo de
# TESTE (sem cancelar, para seguir com receber + conciliação) e, noutro disparo,
# cancela. Nunca toca produção.
on:
  workflow_dispatch:
    inputs:
      modo:
        description: "emitir | cancelar"
        required: true
      doc_id:
        description: "vendas.documentos.id (modo emitir)"
        required: false
      emissao_id:
        description: "orders.fat_emissoes.id (modo cancelar)"
        required: false

jobs:
  teste:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Teste
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FOCUS_TOKEN_MASTER: ${{ secrets.FOCUS_TOKEN_MASTER }}
          MODO: ${{ github.event.inputs.modo }}
          DOC_ID: ${{ github.event.inputs.doc_id }}
          EMISSAO_ID: ${{ github.event.inputs.emissao_id }}
        run: npx --yes tsx --conditions=react-server --tsconfig tsconfig.json scripts/teste-ciclo-final.ts
