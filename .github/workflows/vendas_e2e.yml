name: Vendas — PV/OS nativo → faturamento (teste E2E, homologação)

# P1 + P5 (05/10/2026): pega um PV/OS nativo de TESTE (DOC_ID), emite a NF em
# HOMOLOGAÇÃO pela Focus, confere PV faturado + espelho + contas a receber,
# cancela a NF e confere o desfazer. Nunca toca produção.
on:
  workflow_dispatch:
    inputs:
      doc_id:
        description: "id do PV/OS nativo de teste (vendas.documentos.id)"
        required: true

jobs:
  teste:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Teste
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FOCUS_TOKEN_MASTER: ${{ secrets.FOCUS_TOKEN_MASTER }}
          DOC_ID: ${{ github.event.inputs.doc_id }}
        run: npx --yes tsx --conditions=react-server --tsconfig tsconfig.json scripts/teste-vendas-e2e.ts
