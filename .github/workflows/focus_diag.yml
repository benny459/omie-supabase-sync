name: Focus NFe — diagnóstico (só leitura)

on:
  workflow_dispatch:
    inputs:
      chaves:
        description: "Chaves de NF-e para consultar na Focus (separadas por vírgula)"
        required: false
        default: ""
      modo:
        description: "focus (padrão) | omie (diagnóstico fiscal, só leitura) | config (simula a configuração de emissão) | config-aplicar (grava na Focus)"
        required: false
        default: "focus"
      so_municipio:
        description: "Só consultar o município (NFS-e Barueri)? deixe vazio para o diagnóstico completo"
        required: false
        default: ""

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FOCUS_TOKEN_MASTER: ${{ secrets.FOCUS_TOKEN_MASTER }}
          FOCUS_TOKEN_SF: ${{ secrets.FOCUS_TOKEN_SF }}
          FOCUS_CHAVES: ${{ github.event.inputs.chaves }}
          FOCUS_SO_MUNICIPIO: ${{ github.event.inputs.so_municipio }}
          FOCUS_CONFIRMA: ${{ github.event.inputs.modo == 'config-aplicar' && 'SIM' || '' }}
          OMIE_APP_KEY_SF: ${{ secrets.OMIE_APP_KEY_SF }}
          OMIE_APP_SECRET_SF: ${{ secrets.OMIE_APP_SECRET_SF }}
          PYTHONUNBUFFERED: "1"
        run: |
          case "${{ github.event.inputs.modo }}" in
            omie) python3 scripts/diag_omie_fiscal.py ;;
            omie-docs) SO_DOCUMENTOS=1 python3 scripts/diag_omie_fiscal.py ;;
            config|config-aplicar) python3 scripts/config_focus_empresa.py ;;
            *) python3 scripts/diag_focus.py ;;
          esac
