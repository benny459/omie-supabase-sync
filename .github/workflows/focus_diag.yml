name: Focus NFe — diagnóstico (só leitura)

on:
  workflow_dispatch:
    inputs:
      chaves:
        description: "Chaves de NF-e para consultar na Focus (separadas por vírgula)"
        required: false
        default: ""
      modo:
        description: "focus (padrão) ou omie (diagnóstico fiscal do Omie, só leitura)"
        required: false
        default: "focus"
      so_municipio:
        description: "Só consultar o município (NFS-e Barueri)? deixe vazio para o diagnóstico completo"
        required: false
        default: ""

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FOCUS_TOKEN_MASTER: ${{ secrets.FOCUS_TOKEN_MASTER }}
          FOCUS_TOKEN_SF: ${{ secrets.FOCUS_TOKEN_SF }}
          FOCUS_CHAVES: ${{ github.event.inputs.chaves }}
          FOCUS_SO_MUNICIPIO: ${{ github.event.inputs.so_municipio }}
          OMIE_APP_KEY_SF: ${{ secrets.OMIE_APP_KEY_SF }}
          OMIE_APP_SECRET_SF: ${{ secrets.OMIE_APP_SECRET_SF }}
          PYTHONUNBUFFERED: "1"
        run: |
          if [ "${{ github.event.inputs.modo }}" = "omie" ]; then python3 scripts/diag_omie_fiscal.py; else python3 scripts/diag_focus.py; fi
