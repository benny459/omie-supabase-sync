name: Faturamento — teste E2E (homologação)

# Emite documentos de TESTE na Focus em HOMOLOGAÇÃO (sem valor fiscal), confere
# XML/PDF e contas a receber e cancela em seguida. Nunca toca produção: o
# script aborta se a empresa não estiver em homologação. P5, 05/10/2026.
on:
  workflow_dispatch:
    inputs:
      modo:
        description: "nfe | recibo | nfse | todos"
        required: false
        default: "nfe"

jobs:
  teste:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Teste
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FOCUS_TOKEN_MASTER: ${{ secrets.FOCUS_TOKEN_MASTER }}
          MODO: ${{ github.event.inputs.modo }}
        run: npx --yes tsx --conditions=react-server --tsconfig tsconfig.json scripts/teste-faturamento.ts
